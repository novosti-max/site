# ВАЖНО (01.11, 17:35): wall.edit и wall.delete ВК разрешает только с ключом ПОЛЬЗОВАТЕЛЯ, ключом группы — ошибка 27
# («method is unavailable with group auth»). Поэтому бот сам исправить/удалить пост НЕ может: исправления делает Claude
# вручную в браузере под админом, а этот файл — журнал исправлений (что, где, когда, по чьему согласию).
#
# Исправления уже вышедших постов ВК (FIX-14). Бот выполняет каждую запись ОДИН раз (по id) при запуске,
# то есть сразу после коммита в ветку radar-bot, и пишет итог в журнал: «исправление <id>: …».
# Записи не удаляем — это история исправлений. Повторить — новая запись с новым id.
#
# - id: 2026-11-01-lipetsk-456     # уникальный, лучше дата-группа-пост
#   group: lipetsk                 # slug или адрес группы из config.yaml (radarr_lipetsk1)
#   post: 456                      # номер поста (из журнала бота или ссылки vk.ru/wall-<gid>_<номер>)
#   text: |                        # новый текст целиком; не указан — текст не меняется
#     Липецкая область
#     Отбой опасности по БПЛА
#   card: clear                    # danger/clear/missile/missile_clear/mvsh/mvsh_clear/attention — поставить нашу карточку
#                                  # (вместо прежних вложений); none — убрать вложения; не указан — вложения как были
#   delete: true                   # удалить пост — ТОЛЬКО с согласия Никиты

