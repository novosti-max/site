# Настройки бота MAX -> ВКонтакте (без ключей: ключи вводятся на странице настройки и хранятся только на сервере).
timezone: "Europe/Moscow"

rules:
  quiet_per_day: 2            # «Пока тихо» — не больше N раз в сутки на группу
  quiet_min_gap_hours: 6      # и не чаще, чем раз в N часов
  promo_hour: 20              # во сколько (МСК) выходит ежедневный пост «Подписывайтесь в MAX»
  skip_forwards: true         # репосты из чужих каналов в ВК не переносим
  card_gap_minutes: 45        # карточка того же вида в группе — не чаще раза в 45 минут (остальные посты серии — текстом)
  post_news: true             # обычные новости от имени канала (без карточки) тоже переносим; репосты и реклама — нет

# enabled: false — группа пока выключена (нет карточек или ждёт проверки).
# gid — номер группы ВК, cards — номера карточек в альбоме «Карточки оповещений».
