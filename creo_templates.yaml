# Банк текстов крео-бота. Обновляет Claude по итогам утреннего анализа (с одобрения Никиты).
# need — какие факты нужны шаблону (shot, quote, airport, ongoing, clear); без них шаблон не берётся.
# Подстановки: {city} {city_loc} {city_acc} {city_dat} {region_ins} {region_loc} {place} {place_acc} {name} {button}
#   {shot} {shot_word} («беспилотников») {shot_verb} («сбиты») {shot_adj} («сбитых беспилотников»)
#   {quote} {quote_time} {first_time} {clear_time} {airport_name} {airport_cta} {link}
#   ЗАГЛАВНЫМИ ({CITY}, {REGION_INS}, {QUOTE}, {SHOT_WORD}, {AIRPORT_NAME}) — то же капсом.
# Формулировки сетей Андрея и Ильи не пересекаются.

max_zakup:
  headline:
    andrey:
      - {need: [shot, ongoing], text: "⚠️ <b>ВНИМАНИЕ, {CITY}! {shot} {SHOT_WORD} СБИЛИ ЗА НОЧЬ — АТАКА ЕЩЁ ИДЁТ</b>"}
      - {need: [shot], text: "⚠️ <b>ВНИМАНИЕ, {CITY}! ЗА НОЧЬ СБИЛИ {shot} {SHOT_WORD}</b>"}
      - {need: [airport], text: "⚠️ <b>{CITY}: ДРОНЫ, ПВО И ОГРАНИЧЕНИЯ В {AIRPORT_NAME}</b>"}
      - {need: [], text: "⚠️ <b>ВНИМАНИЕ! НАД {REGION_INS} ОПАСНОСТЬ ПО БПЛА</b>"}
    ilya:
      - {need: [quote], text: "🚨 <b>{CITY}: «{QUOTE}» — НОЧЬЮ НА ГОРОД ШЛИ ДРОНЫ</b>"}
      - {need: [shot], text: "🚨 <b>{shot} {SHOT_WORD} НАД {REGION_INS}: ЧТО БЫЛО НОЧЬЮ</b>"}
      - {need: [ongoing], text: "🚨 <b>{CITY}: АТАКА ДРОНОВ ПРОДОЛЖАЕТСЯ</b>"}
      - {need: [], text: "🚨 <b>НОЧЬ БЕЗ СНА: ДРОНЫ НАД {REGION_INS}</b>"}
  cta:
    andrey:
      - "❗️ Не узнавайте об атаке последним. Тревога, отбой, районы с фиксациями{airport_cta} — в «{name}» сразу, как их объявляют."
      - "❗️ Тревога и отбой по {city_dat} и области — в «{name}» в ту же минуту, а не утром из новостей."
    ilya:
      - "❗️ Вы в {city_loc} или области? Подпишитесь на свой радар: тревога, сбития, районы{airport_cta} приходят сразу, как их объявляют."
      - "❗️ Пока одни узнают об атаке утром, подписчики «{name}» получают тревогу в момент объявления — с районами и отбоем."
  link: "👉 <a href=\"https://{link}\">{name}</a>"

summary:
  headline:
    andrey: ["<b>Последствия {attack} атаки БПЛА на {place_acc}</b>"]
    ilya: ["<b>Что осталось после {attack_gen} атаки БПЛА на {place_acc}</b>"]
  cta:
    andrey: ["<b>Всё велось в «{name}»:</b> тревоги, районы, сбития и отбой — в ту же минуту 👇"]
    ilya: ["<b>Всю ночь это шло в «{name}» в прямом эфире:</b> тревоги, сбития, районы и отбой 👇"]
  link: "👉 <a href=\"https://{link}\">{name}</a>"

vk_story:
  andrey:
    - "Ночь над {region_ins} затянулась до утра. Опасность по БПЛА объявили в {first_time}{shot_sentence}{ongoing_sentence}\n\n{airport_sentence}Кто-то не спал всю ночь, а кто-то узнаёт обо всём только сейчас.\n\nВ «{name}» тревога и отбой по {city_dat} и области выходят сразу, как их объявляют.\n\nА вы этой ночью спали или следили за обстановкой?\n\n{name} в MAX — https://{link}"
  ilya:
    - "Этой ночью над {region_ins} снова работала ПВО. Первое предупреждение пришло в {first_time}{shot_sentence}{ongoing_sentence}\n\n{airport_sentence}{quote_sentence}Те, кто подписан на радар, узнавали о каждой тревоге сразу, остальные — только утром.\n\n«{name}» в MAX: тревога, сбития и отбой по {city_dat} и области в момент объявления.\n\nВы узнали о тревоге сразу или уже утром?\n\nПодписаться — https://{link}"

vk_pereliv:
  andrey:
    - "{quote_lead}{shot_sentence_cap}{airport_sentence}Лента ВКонтакте сама решает, какие записи показать первыми, поэтому срочный пост легко пропустить или увидеть уже утром. В MAX каждая тревога, сбития и отбой приходят отдельным уведомлением на экран телефона — сразу и по порядку, с районами.\n\nЕсли хотите узнавать о тревоге в момент объявления, подпишитесь на «{name}» в MAX и включите уведомления:\n👉 https://{link}\n\nА вы этой ночью узнали о тревоге сразу или уже утром?"
  ilya:
    - "{quote_lead}{shot_sentence_cap}{airport_sentence}Во ВКонтакте лента сама выбирает, что показать, и срочное сообщение может прийти с опозданием. В MAX «{name}» присылает каждую тревогу, сбития и отбой отдельным уведомлением — в ту же минуту, по районам.\n\nХотите узнавать о тревоге сразу — подпишитесь в MAX и включите уведомления:\n👉 https://{link}\n\nВаш телефон этой ночью предупредил вас вовремя?"
