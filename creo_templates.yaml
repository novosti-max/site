# Банк текстов крео-бота. Пишет и пополняет Claude (по итогам утреннего анализа, с одобрения Никиты).
# Бот берёт факты из ленты наших каналов и собирает пост из этих кусков, по кругу, чтобы не повторяться.
# need — какие факты нужны куску: shot (сбитые), quote («отойдите от окон»), airport (ограничения в аэропорту),
#   ongoing (атака идёт, оповещение свежее 3 ч), clear (был отбой), places (районы), dur (длилось 2+ ч), night (ночью).
# Подстановки: {city} {city_loc} {city_acc} {city_dat} {region_ins} {region_loc} {place} {place_acc} {name} {link}
#   {shot} {shot_word} {shot_verb} {shot_adj} {shot_attr} {quote} {quote_time} {first_time} {clear_time}
#   {airport_name} {airport_cta} {when} {When} {dur_nom} («7 часов») {dur_gen} («7 часов» после «больше»)
#   {places} («Всеволожский и Кировский районы») {attack} («массированной») {attack_nom} («Массированная»)
#   ЗАГЛАВНЫМИ ({CITY}, {REGION_INS}, {REGION_LOC}, {QUOTE}, {SHOT_WORD}, {SHOT_VERB}, {SHOT_ADJ}, {AIRPORT_NAME},
#   {WHEN}, {DUR_NOM}, {PLACES}, {CITY_LOC}) — то же капсом.
# Правила: факты только из ленты; без «VPN», «белых списков», «обязан»; не спрашивать, где слышали взрывы/работу ПВО;
# формулировки сетей Андрея (⚠️) и Ильи (🚨) не пересекаются.

max_zakup:
  headline:
    andrey:
      - {need: [shot, ongoing], text: "⚠️ <b>ВНИМАНИЕ, {CITY}! {shot} {SHOT_WORD} СБИЛИ — АТАКА ЕЩЁ ИДЁТ</b>"}
      - {need: [shot], text: "⚠️ <b>{CITY}: {shot} {SHOT_WORD} {SHOT_VERB} {WHEN}</b>"}
      - {need: [shot, dur], text: "⚠️ <b>{DUR_NOM} ПОД ДРОНАМИ: НАД {REGION_INS} {SHOT_VERB} {shot} {SHOT_WORD}</b>"}
      - {need: [ongoing], text: "⚠️ <b>ВНИМАНИЕ, {CITY}! ДРОНЫ НАД {REGION_INS} ПРЯМО СЕЙЧАС</b>"}
      - {need: [airport], text: "⚠️ <b>{CITY}: ДРОНЫ, РАБОТА ПВО И ОГРАНИЧЕНИЯ В {AIRPORT_NAME}</b>"}
      - {need: [quote], text: "⚠️ <b>«{QUOTE}» — {CITY} {WHEN} ПОД АТАКОЙ ДРОНОВ</b>"}
      - {need: [clear, dur], text: "⚠️ <b>ОТБОЙ ТОЛЬКО В {clear_time}: {DUR_NOM} ОПАСНОСТИ НАД {REGION_INS}</b>"}
      - {need: [places], text: "⚠️ <b>{PLACES}: ФИКСАЦИИ БПЛА {WHEN}</b>"}
      - {need: [active], text: "⚠️ <b>ВНИМАНИЕ! НАД {REGION_INS} ОПАСНОСТЬ ПО БПЛА</b>"}
      - {need: [active, regional], text: "⚠️ <b>{CITY}, ЭТО КАСАЕТСЯ ВСЕХ: ДРОНЫ НАД {REGION_INS}</b>"}
      - {need: [clear], text: "⚠️ <b>{CITY}, ОТБОЙ — НО ВОТ ЧТО БЫЛО {WHEN}</b>"}
    ilya:
      - {need: [quote], text: "🚨 <b>{CITY}: «{QUOTE}» — {WHEN} НА ГОРОД ШЛИ ДРОНЫ</b>"}
      - {need: [shot], text: "🚨 <b>{shot} {SHOT_WORD} НАД {REGION_INS}: ЧТО БЫЛО {WHEN}</b>"}
      - {need: [ongoing], text: "🚨 <b>{CITY}: АТАКА ДРОНОВ ПРОДОЛЖАЕТСЯ</b>"}
      - {need: [night], text: "🚨 <b>НОЧЬ БЕЗ СНА: ДРОНЫ НАД {REGION_INS}</b>"}
      - {need: [shot, airport], text: "🚨 <b>{shot} {SHOT_ADJ} И ОГРАНИЧЕНИЯ В {AIRPORT_NAME}: ЧТО ПРОИЗОШЛО</b>"}
      - {need: [dur], text: "🚨 <b>{DUR_NOM} ТРЕВОГИ В {REGION_LOC}: КАК ЭТО БЫЛО</b>"}
      - {need: [places], text: "🚨 <b>{PLACES} — ДРОНЫ ФИКСИРОВАЛИ {WHEN}</b>"}
      - {need: [regional], text: "🚨 <b>{CITY}, ВЫ ЗНАЕТЕ, ЧТО ПРОИСХОДИЛО {WHEN}?</b>"}
      - {need: [clear, night], text: "🚨 <b>ОТБОЙ В {REGION_LOC}, НО НОЧЬ БЫЛА ТЯЖЁЛОЙ</b>"}
      - {need: [], text: "🚨 <b>ДРОНЫ НАД {REGION_INS}: ГЛАВНОЕ, ЧТО НУЖНО ЗНАТЬ</b>"}
  lead:
    andrey:
      - {need: [ongoing], text: "С {first_time} в {region_loc} опасность по БПЛА, отбоя пока нет."}
      - {need: [clear], text: "Опасность по БПЛА в {region_loc} объявили в {first_time}, отбой — только в {clear_time}."}
      - {need: [clear, dur], text: "Больше {dur_gen} в {region_loc} действовал режим опасности: с {first_time} до {clear_time}."}
      - {need: [], text: "С {first_time} в {region_loc} действовала опасность по БПЛА."}
    ilya:
      - {need: [ongoing], text: "Первая тревога пришла в {first_time} — и она до сих пор не снята."}
      - {need: [clear, dur], text: "Тревога длилась {dur_nom}: с {first_time} до {clear_time}."}
      - {need: [night], text: "Пока город спал, в {first_time} пришло первое предупреждение."}
      - {need: [], text: "Первое предупреждение в {region_loc} пришло в {first_time}."}
  places:
    andrey:
      - "Фиксации: {places}."
      - "Дроны фиксировали над районами: {places_list}."
    ilya:
      - "В оповещениях канала звучали {places}."
      - "Районы с фиксациями: {places_list}."
  quote:
    andrey:
      - "Жителям писали: «{quote}»"
      - "В {quote_time} в канале вышло: «{quote}»"
    ilya:
      - "В {quote_time} подписчикам пришло: «{quote}»"
      - "Было и такое предупреждение: «{quote}»"
  shot:
    andrey:
      - "<b>Над {region_ins} {shot_verb} {shot} {shot_word}{shot_attr}.</b>"
      - "<b>{shot} {shot_word} {shot_verb}{shot_attr}.</b>"
    ilya:
      - "<b>{shot} {shot_word} {shot_verb} над {region_ins}{shot_attr}.</b>"
      - "<b>Итог на этот час: {shot} {shot_adj}{shot_attr}.</b>"
  airport:
    andrey:
      - "В {airport_name} вводили ограничения на рейсы."
      - "{airport_name} работал с ограничениями."
    ilya:
      - "Аэропорт {airport_name} принимал и выпускал рейсы с ограничениями."
      - "В {airport_name} задерживали рейсы."
  ongoing:
    andrey:
      - "<b>Опасность сохраняется прямо сейчас.</b>"
      - "<b>Отбоя ещё не было.</b>"
    ilya:
      - "<b>Атака ещё не закончилась.</b>"
      - "<b>Тревога продолжается.</b>"
  cta:
    andrey:
      - "❗️ Не узнавайте об атаке последним. Тревога, отбой, районы с фиксациями{airport_cta} — в «{name}» сразу, как их объявляют."
      - "❗️ Тревога и отбой по {area} — в «{name}» в ту же минуту, а не утром из новостей."
      - "❗️ Пока лента новостей догоняет, в «{name}» уже пишут, где фиксируют дроны и когда отбой."
      - "❗️ Одно уведомление — и вы знаете, что происходит над {region_ins}. Подпишитесь на «{name}» и включите звук."
      - "❗️ Районы, сбития, отбой{airport_cta} — всё по {area} в одном канале: «{name}»."
      - "❗️ Сохраните себе «{name}» — в следующий раз узнаете первыми."
    ilya:
      - {need: [regional], text: "❗️ Вы в {city_loc} или области? Подпишитесь на свой радар: тревога, сбития, районы{airport_cta} приходят сразу, как их объявляют."}
      - "❗️ Пока одни узнают об атаке утром, подписчики «{name}» получают тревогу в момент объявления — с районами и отбоем."
      - {need: [regional], text: "❗️ Живёте в {city_loc} или рядом? Радар присылает каждую тревогу и отбой отдельным уведомлением — подпишитесь, пока тихо."}
      - {need: [regional], text: "❗️ Перешлите этот пост родным в {city_loc}: пусть тоже узнают о тревоге сразу, а не по утренним новостям."}
      - "❗️ Каждое предупреждение и каждый отбой — в «{name}». Без лишнего, только по {area}."
      - "❗️ Подпишитесь сейчас — в следующую тревогу уведомление придёт само."
  link: "👉 <a href=\"https://{link}\">{name}</a>"

